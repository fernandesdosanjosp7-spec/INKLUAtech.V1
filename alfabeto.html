<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INKLUAtech | Alfabeto Falado</title>
    <link rel="stylesheet" href="home.css">
</head>
<body class="alphabet-page">
    <main class="alphabet-shell">
        <header class="alphabet-topbar">
            <a class="brand" href="home.html">
                <img src="assets/ink-logo.png" alt="Logo Inklua Tech">
                <span>Inklua Tech</span>
            </a>
            <a class="topbar-button" href="home.html#jogos">Voltar aos jogos</a>
        </header>

        <section class="alphabet-focus" aria-labelledby="alphabet-title">
            <div class="alphabet-intro">
                <p class="eyebrow">Jogo educativo</p>
                <h1 id="alphabet-title">Alfabeto Falado</h1>
                <p>Toque em uma letra para ouvir seu nome em voz alta.</p>
            </div>

            <div class="alphabet-game alphabet-game--standalone">
                <div class="alphabet-display" id="alphabetDisplay" aria-live="polite">A</div>
                <div class="alphabet-grid" aria-label="Letras do alfabeto">
                    <button class="alphabet-letter" type="button" data-letter="A">A</button>
                    <button class="alphabet-letter" type="button" data-letter="B">B</button>
                    <button class="alphabet-letter" type="button" data-letter="C">C</button>
                    <button class="alphabet-letter" type="button" data-letter="D">D</button>
                    <button class="alphabet-letter" type="button" data-letter="E">E</button>
                    <button class="alphabet-letter" type="button" data-letter="F">F</button>
                    <button class="alphabet-letter" type="button" data-letter="G">G</button>
                    <button class="alphabet-letter" type="button" data-letter="H">H</button>
                    <button class="alphabet-letter" type="button" data-letter="I">I</button>
                    <button class="alphabet-letter" type="button" data-letter="J">J</button>
                    <button class="alphabet-letter" type="button" data-letter="K">K</button>
                    <button class="alphabet-letter" type="button" data-letter="L">L</button>
                    <button class="alphabet-letter" type="button" data-letter="M">M</button>
                    <button class="alphabet-letter" type="button" data-letter="N">N</button>
                    <button class="alphabet-letter" type="button" data-letter="O">O</button>
                    <button class="alphabet-letter" type="button" data-letter="P">P</button>
                    <button class="alphabet-letter" type="button" data-letter="Q">Q</button>
                    <button class="alphabet-letter" type="button" data-letter="R">R</button>
                    <button class="alphabet-letter" type="button" data-letter="S">S</button>
                    <button class="alphabet-letter" type="button" data-letter="T">T</button>
                    <button class="alphabet-letter" type="button" data-letter="U">U</button>
                    <button class="alphabet-letter" type="button" data-letter="V">V</button>
                    <button class="alphabet-letter" type="button" data-letter="W">W</button>
                    <button class="alphabet-letter" type="button" data-letter="X">X</button>
                    <button class="alphabet-letter" type="button" data-letter="Y">Y</button>
                    <button class="alphabet-letter" type="button" data-letter="Z">Z</button>
                </div>
            </div>
        </section>
    </main>

    <script src="alfabeto.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INKLUAtech | Jogo das Emo&ccedil;&otilde;es</title>
    <link rel="stylesheet" href="home.css">
</head>
<body class="emotion-page">
    <main class="emotion-shell">
        <header class="emotion-topbar">
            <a class="brand" href="home.html">
                <img src="assets/ink-logo.png" alt="Logo Inklua Tech">
                <span>Inklua Tech</span>
            </a>
            <a class="topbar-button" href="home.html#jogos">Voltar aos jogos</a>
        </header>

        <section class="emotion-focus" aria-labelledby="emotion-title">
            <div class="emotion-intro">
                <p class="eyebrow">Jogo educativo</p>
                <h1 id="emotion-title">Jogo das Emo&ccedil;&otilde;es</h1>
                <p>Observe a situa&ccedil;&atilde;o e escolha a emo&ccedil;&atilde;o que combina melhor.</p>
            </div>

            <div class="emotion-progress" aria-label="Progresso do jogo">
                <span id="emotionStep">1</span>
                <span>de</span>
                <span id="emotionTotal">4</span>
            </div>

            <article class="emotion-situation" aria-live="polite">
                <span class="emotion-situation__label">Situa&ccedil;&atilde;o</span>
                <h2 id="emotionSituation">Ana ganhou um presente.</h2>
            </article>

            <div class="emotion-grid" id="emotionOptions" aria-label="Op&ccedil;&otilde;es de emo&ccedil;&atilde;o"></div>

            <p class="emotion-feedback" id="emotionFeedback" aria-live="polite"></p>

            <div class="emotion-actions">
                <button class="complete-button" id="nextEmotion" type="button" disabled>Pr&oacute;xima situa&ccedil;&atilde;o</button>
                <button class="topbar-button" id="restartEmotion" type="button" hidden>Jogar novamente</button>
            </div>

            <section class="emotion-checkin" id="emotionCheckin" aria-labelledby="checkin-title" hidden>
                <div>
                    <p class="eyebrow">Express&atilde;o</p>
                    <h2 id="checkin-title">Como voc&ecirc; se sente hoje?</h2>
                </div>
                <div class="emotion-grid emotion-grid--compact" id="checkinOptions" aria-label="Escolha como voc&ecirc; se sente"></div>
                <p class="emotion-feedback" id="checkinFeedback" aria-live="polite"></p>
            </section>
        </section>
    </main>

    <script src="emocoes.js"></script>
</body>
</html>

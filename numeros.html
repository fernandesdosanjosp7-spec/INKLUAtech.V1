<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INKLUAtech | N&uacute;meros Falados</title>
    <link rel="stylesheet" href="home.css">
</head>
<body class="number-page">
    <main class="number-shell">
        <header class="number-topbar">
            <a class="brand" href="home.html">
                <img src="assets/ink-logo.png" alt="Logo Inklua Tech">
                <span>Inklua Tech</span>
            </a>
            <a class="topbar-button" href="home.html#jogos">Voltar aos jogos</a>
        </header>

        <section class="number-focus" aria-labelledby="number-title">
            <div class="number-intro">
                <p class="eyebrow">Jogo educativo</p>
                <h1 id="number-title">N&uacute;meros Falados</h1>
                <p>Toque em um n&uacute;mero de 0 a 10 para ouvir qual n&uacute;mero &eacute;.</p>
            </div>

            <div class="number-game number-game--standalone">
                <div class="number-display" id="numberDisplay" aria-live="polite">0</div>
                <div class="number-grid" aria-label="N&uacute;meros de 0 a 10">
                    <button class="number-button" type="button" data-number="0">0</button>
                    <button class="number-button" type="button" data-number="1">1</button>
                    <button class="number-button" type="button" data-number="2">2</button>
                    <button class="number-button" type="button" data-number="3">3</button>
                    <button class="number-button" type="button" data-number="4">4</button>
                    <button class="number-button" type="button" data-number="5">5</button>
                    <button class="number-button" type="button" data-number="6">6</button>
                    <button class="number-button" type="button" data-number="7">7</button>
                    <button class="number-button" type="button" data-number="8">8</button>
                    <button class="number-button" type="button" data-number="9">9</button>
                    <button class="number-button" type="button" data-number="10">10</button>
                </div>
            </div>
        </section>
    </main>

    <script src="game-progress.js"></script>
    <script src="numeros.js"></script>
</body>
</html>

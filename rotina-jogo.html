<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INKLUAtech | Sequ&ecirc;ncia da Rotina</title>
    <link rel="stylesheet" href="home.css">
</head>
<body class="simple-game-page">
    <main class="simple-game-shell">
        <header class="simple-game-topbar">
            <a class="brand" href="home.html">
                <img src="assets/ink-logo.png" alt="Logo Inklua Tech">
                <span>Inklua Tech</span>
            </a>
            <a class="topbar-button" href="home.html#jogos">Voltar aos jogos</a>
        </header>

        <section class="simple-game-focus section-block" aria-labelledby="routine-game-title">
            <p class="eyebrow">Jogo educativo</p>
            <h1 id="routine-game-title">Sequ&ecirc;ncia da Rotina</h1>
            <p>Depois da chegada, qual etapa pode vir na rotina?</p>

            <div class="choice-row simple-choice-row" aria-label="Op&ccedil;&otilde;es de resposta">
                <button type="button">Pausa</button>
                <button type="button" data-correct="true">Atividade</button>
                <button type="button">Ir embora</button>
                <button type="button">Dormir</button>
            </div>

            <p class="game-feedback" aria-live="polite"></p>
        </section>
    </main>

    <script src="game-progress.js"></script>
    <script src="jogo-escolha.js"></script>
</body>
</html>
